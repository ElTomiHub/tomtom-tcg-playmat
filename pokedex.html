<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b213b">
  <title>Pokédex · Pokémon TCG Playmat</title>
  <link rel="icon" href="assets/playmat-icon-192.png">
  <link rel="stylesheet" href="assets/pokedex.css?v=15">
  <script defer src="assets/starter-library.js"></script>
  <script defer src="assets/pokedex-species-names.js?v=1"></script>
  <script defer src="assets/library-sync.js?v=5"></script>
  <script defer src="assets/pokedex-sync.js?v=3"></script>
  <script defer src="assets/pokedex-scan.js?v=5"></script>
  <script defer src="assets/pokedex.js?v=13"></script>
</head>
<body>
  <main>
    <div class="sticky-top">
      <header class="hero">
        <div class="heading"><a class="lobby-logo" href="./" aria-label="Return to Battle Lobby"><img src="logo.png" alt="" width="48" height="48"></a><div><p>Pokémon TCG</p><h1>Pokédex Tracker</h1></div></div>
      </header>
      <nav aria-label="Collection views">
        <button type="button" data-view="cards" aria-pressed="true">Pokédex</button>
        <button type="button" data-view="binder" aria-pressed="false">Binder</button>
        <button type="button" data-view="missing" aria-pressed="false">Missing Pokémon</button>
        <button type="button" data-view="recent" aria-pressed="false">Recent cards</button>
        <button type="button" data-view="progress" aria-pressed="false">Progress</button>
      </nav>
      <details id="collectionSync">
        <summary aria-labelledby="collectionSyncHeading collectionSyncBadge" title="Collection sync">
          <span id="collectionSyncBadge"></span>
        </summary>
        <div class="panel collection-sync-menu">
          <strong id="collectionSyncHeading">Collection sync</strong>
          <p id="collectionSyncStatus" role="status" aria-live="polite"></p>
          <form id="collectionSyncForm" hidden>
            <div class="inputs">
              <label>Email <input type="email" id="collectionSyncEmail" autocomplete="username" required></label>
              <label>Password <input type="password" id="collectionSyncPassword" autocomplete="current-password" required></label>
            </div>
            <button type="submit" class="primary" id="collectionSignIn">Sign in</button>
          </form>
          <div id="collectionSyncControls" hidden>
            <button type="button" id="collectionSyncNow">Sync now</button>
            <button type="button" id="collectionSyncSignOut">Sign out</button>
          </div>
        </div>
      </details>
      <div id="filters">
        <div class="inputs filter-fields">
          <label>Search <input id="search" type="search" placeholder="Name (EN, FR, JP), set, or number"></label>
          <label id="regionField">Region <select id="regionFilter"><option value="">All regions</option></select></label>
          <label id="variantField">Variant <select id="variantFilter"><option value="">All variants</option></select></label>
        </div>
        <div class="filter-actions">
          <div id="collectionFilter" role="group" aria-label="Collection status">
            <button type="button" data-collection="all" aria-pressed="true">All</button>
            <button type="button" data-collection="collected" aria-pressed="false">Collected</button>
            <button type="button" data-collection="missing" aria-pressed="false">Missing</button>
          </div>
          <div class="collection-progress" id="collectionProgress">
            <span id="collectionProgressLabel"></span>
            <progress id="collectionProgressBar" aria-label="Pokédex species collected"></progress>
          </div>
          <button type="button" id="resetFilters">Reset filters</button>
        </div>
      </div>
    </div>
    <p id="notice" role="status" aria-live="polite"></p>
    <section aria-labelledby="viewHeading">
      <div class="toolbar">
        <h2 id="viewHeading" tabindex="-1">Pokédex</h2>
      </div>
      <div id="binderViews" role="group" aria-label="Choose a binder" hidden>
        <button type="button" data-binder-view="1" aria-pressed="true">Binder 1 <small>Gen I–III</small></button>
        <button type="button" data-binder-view="2" aria-pressed="false">Binder 2 <small>Gen IV–VI</small></button>
        <button type="button" data-binder-view="3" aria-pressed="false">Binder 3 <small>Gen VII–IX</small></button>
        <button type="button" data-binder-view="other" aria-pressed="false">Other cards</button>
      </div>
      <p id="resultCount" aria-live="polite"></p>
      <div id="results"></div>
      <button type="button" id="more" hidden>Show more</button>
    </section>
  </main>
  <div class="collection-actions">
    <button class="primary" type="button" id="addCard">＋ Add card</button>
  </div>
  <dialog id="scanner" aria-labelledby="scannerHeading">
    <div class="scanner-heading">
      <h2 id="scannerHeading">Add card</h2>
      <button type="button" id="closeScanner" aria-label="Close add card">×</button>
    </div>
    <div class="scanner-camera" id="scannerPreview" hidden>
      <video id="scannerVideo" autoplay muted playsinline aria-label="Live camera preview"></video>
      <div class="scanner-frame" id="scannerFrame" aria-hidden="true"></div>
      <button type="button" id="scannerTorch" aria-pressed="false" disabled>⚡ Flash</button>
    </div>
    <div class="scanner-actions">
      <button type="button" class="primary" id="scannerTake" disabled>Take photo</button>
      <button type="button" id="scannerStart" hidden>Open camera</button>
      <button type="button" id="scannerPhone" hidden>Phone camera</button>
      <button type="button" id="scannerChoose">Choose image</button>
      <button type="button" id="scannerPaste">Paste image</button>
      <button type="button" id="scannerManual" aria-controls="scannerLookup" aria-expanded="false">Enter manually</button>
      <input type="file" id="scannerCamera" accept="image/*" capture="environment" hidden>
      <input type="file" id="scannerFile" accept="image/*" hidden>
    </div>
    <p class="note" id="scannerPasteHint" hidden>Paste a card image here with Ctrl+V or ⌘V, or enter the set and number below.</p>
    <img id="scannerPhoto" alt="Your card photo" hidden>
    <form id="scannerLookup" hidden>
      <div class="inputs">
        <label>Set code <input name="set" maxlength="24" placeholder="SV2a"></label>
        <label>Collector number <input name="number" maxlength="24" placeholder="025/165"></label>
        <label>Variant <select name="variant" id="scanVariant"></select></label>
        <label>Printed name <input name="name" maxlength="100" placeholder="Optional if set is known"></label>
      </div>
      <div class="scanner-form-actions">
        <button type="submit" class="primary">Look up print</button>
        <button type="button" id="scannerRegister">Add without lookup</button>
      </div>
    </form>
    <p id="scannerStatus" role="status"></p>
    <div id="scannerCandidates" class="scanner-actions"></div>
    <div id="scannerResult"></div>
  </dialog>
  <dialog id="editor" aria-labelledby="editorHeading">
    <form id="editorForm">
      <h2 id="editorHeading">Add card</h2>
      <div class="editor-layout">
        <div class="editor-fields">
          <div class="editor-pokemon">
            <label><span id="editorNameLabel">Pokémon</span>
              <span class="editor-name-field"><span id="editorSprite" hidden></span><input name="name" maxlength="120" autocomplete="off"></span>
            </label>
            <label id="speciesField">Pokédex no. <input name="pokemonId" type="number" min="1" max="1025" step="1"></label>
          </div>
          <label id="formField" hidden>Pokémon form <select name="pokemonForm"></select></label>
          <div id="editorOrganization" aria-live="polite" hidden></div>
          <div class="inputs">
            <label>Set <input name="set" maxlength="100"></label>
            <label>Card number <input name="number" maxlength="40"></label>
          </div>
          <label>Variant <select name="variant"></select></label>
        </div>
        <figure id="editorArtwork" class="editor-artwork"></figure>
      </div>
      <p id="editorStatus" role="status"></p>
      <div id="deleteCardConfirm" hidden>
        <p>Delete this copy from your collection?</p>
        <div class="scanner-form-actions">
          <button type="button" id="keepCard">Keep card</button>
          <button type="button" class="danger" id="confirmDeleteCard">Delete this copy</button>
        </div>
      </div>
      <footer>
        <button type="button" class="danger" id="deleteCard" hidden>Delete card</button>
        <button type="button" id="cancelEdit">Cancel</button>
        <button type="submit" class="primary">Save card</button>
      </footer>
    </form>
  </dialog>
  <datalist id="editorPokemonNames"></datalist>
</body>
</html>
